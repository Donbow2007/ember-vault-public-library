<text x="96" y="76" fill="#d57838" font-family="monospace" font-size="18" letter-spacing="4">EMBER VAULT // FIELD DIAGRAM</text>
<text x="96" y="148" fill="#edede8" font-family="Arial, sans-serif" font-size="52" font-weight="700">Environmental Conditions</text>
<text x="96" y="202" fill="#9a9c98" font-family="Arial, sans-serif" font-size="23"><tspan x="96" dy="0">Reviewed instructional sequence based on the approved Ember Vault article.</tspan></text>
<rect x="96" y="290" width="1344" height="150" rx="8" fill="#111313" stroke="#edede8" stroke-width="2"/>
<circle cx="160" cy="365" r="34" fill="#202322" stroke="#edede8" stroke-width="2"/>
<text x="160" y="375" fill="#edede8" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700">1</text>
<text x="224" y="339" fill="#edede8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Identify Environmental Conditions</text>
<text x="224" y="381" fill="#a9aaa6" font-family="Arial, sans-serif" font-size="20"><tspan x="224" dy="0">Climate, terrain, and life forms are the basic components of all environments.</tspan></text>
<path d="M768 448V472" stroke="#555754" stroke-width="4"/> 
<path d="M754 460L768 474L782 460" fill="none" stroke="#d57838" stroke-width="4"/> 
<rect x="96" y="482" width="1344" height="150" rx="8" fill="#111313" stroke="#edede8" stroke-width="2"/>
<circle cx="160" cy="557" r="34" fill="#202322" stroke="#edede8" stroke-width="2"/>
<text x="160" y="567" fill="#edede8" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700">2</text>
<text x="224" y="531" fill="#edede8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Assess Survival Impact</text>
<text x="224" y="573" fill="#a9aaa6" font-family="Arial, sans-serif" font-size="20"><tspan x="224" dy="0">Climatic conditions have a significant impact on other aspects of survival, such as water</tspan><tspan x="224" dy="29">and food availability, travel, recovery, and personal sustenance.</tspan></text>
<text x="96" y="712" fill="#666865" font-family="monospace" font-size="15" letter-spacing="2">LOCAL VECTOR • VERIFY AGAINST THE APPROVED ARTICLE BEFORE USE</text>
