<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="946" viewBox="0 0 1536 946" role="img" aria-labelledby="title description">
<title id="title">Compass Bearing</title>
<desc id="description">Reviewed instructional sequence based on the approved Ember Vault article.</desc>
<rect width="100%" height="100%" fill="#080909"/>
<path d="M0 0H1536V10H0Z" fill="#d57838"/>
<text x="96" y="76" fill="#d57838" font-family="monospace" font-size="18" letter-spacing="4">EMBER VAULT // FIELD DIAGRAM</text>
<text x="96" y="148" fill="#edede8" font-family="Arial, sans-serif" font-size="52" font-weight="700">Compass Bearing</text>
<text x="96" y="202" fill="#9a9c98" font-family="Arial, sans-serif" font-size="23"><tspan x="96" dy="0">Reviewed instructional sequence based on the approved Ember Vault article.</tspan></text>
<rect x="96" y="290" width="1344" height="150" rx="8" fill="#111313" stroke="#edede8" stroke-width="2"/>
<circle cx="160" cy="365" r="34" fill="#202322" stroke="#edede8" stroke-width="2"/>
<text x="160" y="375" fill="#edede8" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700">1</text>
<text x="224" y="339" fill="#edede8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Step 2: Align the Compass Needle</text>
<text x="224" y="381" fill="#a9aaa6" font-family="Arial, sans-serif" font-size="20"><tspan x="224" dy="0">Rotate the compass dial until the north end of the orienting arrow is directly beneath the</tspan><tspan x="224" dy="29">north end of the compass needle.</tspan></text>
<path d="M768 448V472" stroke="#555754" stroke-width="4"/> 
<path d="M754 460L768 474L782 460" fill="none" stroke="#d57838" stroke-width="4"/> 
<rect x="96" y="482" width="1344" height="150" rx="8" fill="#111313" stroke="#edede8" stroke-width="2"/>
<circle cx="160" cy="557" r="34" fill="#202322" stroke="#edede8" stroke-width="2"/>
<text x="160" y="567" fill="#edede8" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700">2</text>
<text x="224" y="531" fill="#edede8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Step 3: Read the Bearing</text>
<text x="224" y="573" fill="#a9aaa6" font-family="Arial, sans-serif" font-size="20"><tspan x="224" dy="0">The bearing is read from the dial where it touches the back end of the Direction of Travel</tspan><tspan x="224" dy="29">arrow.</tspan></text>
<path d="M768 640V664" stroke="#555754" stroke-width="4"/> 
<path d="M754 652L768 666L782 652" fill="none" stroke="#d57838" stroke-width="4"/> 
<rect x="96" y="674" width="1344" height="150" rx="8" fill="#111313" stroke="#d57838" stroke-width="2"/>
<circle cx="160" cy="749" r="34" fill="#d57838" stroke="#d57838" stroke-width="2"/>
<text x="160" y="759" fill="#080909" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700">3</text>
<text x="224" y="723" fill="#edede8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Warning: Inaccurate Bearings Due to Tilt</text>
<text x="224" y="765" fill="#a9aaa6" font-family="Arial, sans-serif" font-size="20"><tspan x="224" dy="0">The example of &#39;50 degrees&#39; should be explained in the source text.</tspan></text>
<text x="1380" y="710" fill="#d57838" text-anchor="end" font-family="monospace" font-size="15" letter-spacing="2">WARNING</text>
<text x="96" y="904" fill="#666865" font-family="monospace" font-size="15" letter-spacing="2">LOCAL VECTOR • VERIFY AGAINST THE APPROVED ARTICLE BEFORE USE</text>
</svg>